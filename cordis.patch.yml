# DROS VajraClaw Cordis Bundle Patch
# Mounts the deterministic agent runtime governance plugin into a DSH profile composition.
- insert:
    - id: dros-vajraclaw
      name: dsh-plugin-vajraclaw
      config:
        enableEmbeddedEngine: true
        strictFailClosed: false
        gatewayUrl: http://localhost:8080
        auditLogDir: .dros-audit
